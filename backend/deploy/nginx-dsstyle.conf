# =================================================================
# DS Style API - Nginx Reverse Proxy Configuration
# Domain: api-dsstyle.endmartaddis.com
# Backend Upstream: http://127.0.0.1:3040
# =================================================================

upstream dsstyle_backend {
    server 127.0.0.1:3040;
    keepalive 32;
}

server {
    server_name api-dsstyle.endmartaddis.com;

    # File Upload Limits & Timeouts
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Main API Routing
    location / {
        proxy_pass http://dsstyle_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket Support (Socket.IO)
    location /socket.io/ {
        proxy_pass http://dsstyle_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    listen 80;

}


