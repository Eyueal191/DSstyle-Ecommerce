    <!-- 🌓 Instant Theme Script (Zero-Flicker / Zero-Blinking on Load - Default to Light) -->
    <script>
      (function() {
        try {
          var t = JSON.parse(localStorage.getItem('dsstyle_theme_v6') || '{}');
          if (t.themeMode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- ✈️ Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
