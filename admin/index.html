<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- 🔖 Title -->
    <title>DS Style | Admin Management Dashboard</title>

    <!-- 🚫 Prevent Stale Cache on New Deployments -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- 🧭 Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=4" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />

    <!-- 📝 SEO Meta Tags -->
    <meta
      name="description"
      content="DS Style Admin Portal - Manage products, inventory, orders, and fulfillment."
    />
    <meta
      name="keywords"
      content="DS Style Admin, store manager, inventory"
    />
    <meta name="author" content="DS Style" />

    <!-- 📱 Social Media (Open Graph & Telegram / WhatsApp) -->
    <meta property="og:site_name" content="DS Style Admin Portal" />
    <meta property="og:title" content="DS Style | Admin Management Dashboard" />
    <meta
      property="og:description"
      content="DS Style Official Admin Portal - Manage catalog, inventory, and orders."
    />
    <meta property="og:image" content="https://admin-dsstyle.endmartaddis.com/logo.jpg" />
    <meta property="og:image:secure_url" content="https://admin-dsstyle.endmartaddis.com/logo.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="DS Style logo" />
    <meta property="og:type" content="website" />

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DS Style | Admin Management Dashboard" />
    <meta
      name="twitter:description"
      content="DS Style Official Admin Portal - Manage catalog, inventory, and orders."
    />
    <meta name="twitter:image" content="https://admin-dsstyle.endmartaddis.com/logo.jpg" />

    <!-- ⚡ Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 🌓 Instant Theme Script (Zero-Flicker / Zero-Blinking on Load - Default to Light for Admin) -->
    <script>
      (function() {
        try {
          var t = JSON.parse(localStorage.getItem('dsstyle_admin_theme_v6') || '{}');
          if (t.themeMode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- ✈️ Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
